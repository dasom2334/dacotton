title: dacotton
tagline: 만든 것과 정한 것
description: 백엔드 엔지니어 dacotton이 만든 프로젝트와 그 과정에서 정한 것, 막힌 것을 기록한다.
url: https://dacotton.dev
lang: ko
timezone: Asia/Seoul
permalink: /log/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/
  mistakes:
    output: true
    permalink: /mistakes/:name/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: mistakes }
    values: { layout: mistake }

exclude:
  - projects/indie-concert-aggregator
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .claude
